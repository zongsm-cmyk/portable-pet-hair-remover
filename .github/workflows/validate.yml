name: Validate store and order gateway
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install gallery image validation dependency
        run: python -m pip install Pillow==12.3.0
      - name: Test catalog, page generation and checkout gates
        run: python -m unittest discover -s tests -v
      - name: Test payment reconciliation, privacy and fulfillment gates
        working-directory: workers/order-gateway
        run: node --test test/*.test.mjs
      - name: Test browser payment receipt and disabled checkout behavior
        run: node --test tests/*.test.mjs
      - name: Read-only production checkout gate diagnostic
        # Informational until Cloudflare production access is authenticated.
        # Never creates/captures orders or prints credentials.
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          url = "https://shop.askouresystems.com/api/health"
          request = urllib.request.Request(
              url, headers={"Accept": "application/json", "User-Agent": "VerveLiving-CI-ReadOnly/1.0"}
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  report = json.load(response)
              fields = {k: report.get(k) for k in ("status", "checkout_enabled", "mode", "launch_offer_available")}
              print("PRODUCTION_HEALTH_PUBLIC_FIELDS=" + json.dumps(fields, sort_keys=True))
              if report.get("checkout_enabled") is not False or report.get("mode") != "sandbox":
                  print("::error::Production checkout mode does not match approved safe-hold settings.")
                  sys.exit(1)
              print("PRODUCTION_CHECKOUT_SAFE_HOLD_VERIFIED=true")
          except (urllib.error.URLError, OSError, ValueError, RuntimeError) as exc:
              print("::warning::Production health not verified: " + type(exc).__name__ + ": " + str(exc))
              sys.exit(1)
          PY
